run_name: m5-xx
type: grpo
data:
  data_folder: data/text2cad
  metadata_csv: data/text2cad/text2cad_v1.1.csv
  split_json: data/text2cad/train_test_val.json
  source_data_type: text2cad
  is_cmdonly: false
  sample_ratio: 1.0
  eval_split_ratio: 0.1
  val_sample_ratio: 0.1
  num_workers: 2
  description_level: expert
  batch_size: 2
  max_samples: null
tokenizer:
  source: huggingface
  model_name: bert-base-uncased
model:
  is_pretrained: true
  encoder_type: bert
  cmd_decoder_type: sdpa
  is_cmd_only: false
  out_type: EightBitBinarizedArgs
  args_decoder_type: sdpa
  d_model: 512
  max_new_cmds: 128
  moe_conf: null
  adaptive_layer: sdpa
  cmd_embedding_type: rope_sdpa
  args_embedding_type: rope_sdpa
  use_drop_out: false
  drop_out_p: 0.0
  freeze_encoder: true
  use_cmd_args_fusion: true
  n_dec_blocks: 6
trainer:
  optimizer: AdamW
  optimizer_kwargs:
    lr: 5.0e-06
    weight_decay: 0.01
  criterion:
    source: local
    cls: EightBitBinarizedArgsCriterion
    kwargs:
      lambda_args: 1.0
  epochs: 10
  max_new_cmds: 84
  eval_steps: 1182
  scheduler: null
  kwargs:
    max_grad_norm: 1.0
    quant_type: fp16
    device: cuda
grpo:
  n_rollouts: 6
  clip_eps: 0.2
  min_cd: 1.0e-5
  max_cd: 0.5
  subset_top_p: 0.2
  subset_refresh_every: 2
  temperature: 0.7
  ref_sync_every: 200
  kl_coef: 0.01
  lambda_arg_reward: 1
  deviation_limit: 10
pretrained_path: out/m4-xx/checkpoint.ckpt
random_seed: 42
use_wandb: true
