run_name: pretrain
type: pretrain
data:
  data_folder: data/text2cad
  metadata_csv: data/text2cad/text2cad_v1.1.csv
  split_json: data/text2cad/train_test_val.json
  source_data_type: text2cad
  is_cmdonly: false
  sample_ratio: 0.05
  eval_split_ratio: 0.2
  num_workers: 4
  description_level: expert
  batch_size: 16
  max_samples: null
tokenizer:
  source: huggingface
  model_name: bert-base-uncased
model:
  is_pretrained: false
  encoder_type: bert
  cmd_decoder_type: torch
  is_cmd_only: false
  args_decoder_type: sdpa
  d_model: 512
  max_new_cmds: 128
  moe_conf: null
  adaptive_layer: sdpa
  cmd_embedding_type: rope_sdpa
  args_embedding_type: rope_sdpa
  use_drop_out: true
  drop_out_p: 0.3
  freeze_encoder: false
trainer:
  optimizer: AdamW
  optimizer_kwargs:
    lr: 1.0e-03
    weight_decay: 0.01
  criterion:
    source: local
    cls: PretrainCriterion
    kwargs:
      kl_weight: 0.1
  epochs: 30
  max_new_cmds: 128
  eval_steps: 1000
  scheduler:
    warmup_ratio: 0.05
  kwargs:
    max_grad_norm: 1.0
pretrained_path: null
random_seed: 42
