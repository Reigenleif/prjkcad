run_name: experiment_1b
data:
  data_root: data/text2cad
  source_data_type: text2cad
  is_cmdonly: false
  sample_ratio: 0.1
  eval_split_ratio: 0.2
  num_workers: 4
  description_level: expert
  batch_size: 16
  max_samples: 100000
tokenizer:
  source: huggingface
  model_name: t5-small
model:
  is_pretrained: false
  encoder_type: t5-small
  cmd_decoder_type: t5-small
  is_cmd_only: false
  args_decoder_type: sdpa
  d_model: 512
  max_new_cmds: 128
trainer:
  optimizer: AdamW
  optimizer_kwargs:
    lr: 5.0e-05
    weight_decay: 0.01
  criterion:
    source: local
    cls: DualSeqCriterion
    kwargs:
      lambda_after_pad: 3
      lambda_overgen: 3
  epochs: 20
  max_new_cmds: 128
  kwargs:
    teacher_forcing_ratio: 1.0
    max_grad_norm: 1.0
    quant_type: fp16
pretrained_path: out/experiment_1a/checkpoint.pt
random_seed: 42
