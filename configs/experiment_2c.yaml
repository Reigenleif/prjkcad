run_name: experiment_2b
data:
  data_root: data/text2cad
  source_data_type: text2cad
  is_cmdonly: false
  sample_ratio: 1.0
  eval_split_ratio: 0.2
  num_workers: 4
  description_level: abstract
  batch_size: 16
  max_samples: null
tokenizer:
  source: huggingface
  model_name: t5-small
model:
  source: local
  cls: BaseModel
  is_pretrained: true
  encoder_type: t5-small
  cmd_decoder_type: t5-small
  is_cmd_only: false
  args_decoder_type: t5-small
  d_model: 512
  kwargs:
    pretrained_model_name: t5-small
    max_new_cmds: 128
trainer:
  optimizer: AdamW
  optimizer_kwargs:
    lr: 0.001
    weight_decay: 0.01
  criterion:
    source: local
    cls: DualSeqCriterion
    kwargs:
      lambda_after_pad: 3
      lambda_overgen: 3
  epochs: 3
  max_new_cmds: 128
  kwargs:
    teacher_forcing_ratio: 1.0
    max_grad_norm: 1.0
    quant_type: fp16
pretrained_path: out/experiment_2a/checkpoint.pt
random_seed: 42
